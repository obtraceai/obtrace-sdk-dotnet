name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: obtrace-runners
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build --configuration Release /p:Version=${GITHUB_REF_NAME#v}
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release /p:Version=${GITHUB_REF_NAME#v} --output ./nupkg
      - run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
