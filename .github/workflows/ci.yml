name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: obtrace-runners
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
        env:
          DOTNET_INSTALL_DIR: /home/runner/.dotnet
      - run: dotnet build src/Obtrace.Sdk/Obtrace.Sdk.csproj -c Release
      - run: dotnet test src/Obtrace.Sdk.Tests/Obtrace.Sdk.Tests.csproj -c Release
